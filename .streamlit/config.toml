[theme]
base = "light"
primaryColor = "#4f46e5"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f6f8"
textColor = "#1f2328"
borderColor = "#e5e7eb"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
headingFontWeights = [700, 650, 600, 600, 600, 600]
headingFontSizes = ["2rem", "1.45rem", "1.15rem", "1.02rem", "0.95rem", "0.9rem"]
linkColor = "#4f46e5"
codeBackgroundColor = "#f3f4f6"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]

[theme.sidebar]
backgroundColor = "#fafafb"

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 50

[browser]
gatherUsageStats = false
